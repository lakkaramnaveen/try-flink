services:
  jobmanager:
    image: flink:1.18.1-scala_2.12
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./sql:/opt/flink/sql:ro
    ports:
      - "8081:8081"
    # Download the kafka connector into flink's lib directory at startup.  The connector version has to match the flink version.
        # I went to maven.org and searched until I found the JARs here with their release dates: https://central.sonatype.com/artifact/org.apache.flink/flink-sql-connector-kafka/versions
        # Clicked "browse" to get the raw JAR url.
    # Additionally, this is the flink-sql-connector-kafka as opposed to the flink-connector-kafka because it includes all of its dependencies.
    entrypoint: >
      bash -c "
      wget -P /opt/flink/lib/ https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.1.0-1.18/flink-sql-connector-kafka-3.1.0-1.18.jar &&
      /docker-entrypoint.sh jobmanager
      "
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        cluster.registration.timeout: 5 min
        # Match the youtube-clicks partition count.  Benchmarked ~2.5x the throughput of parallelism 1 (see bench/).
        parallelism.default: 4

  taskmanager:
    image: flink:1.18.1-scala_2.12
    depends_on:
      - jobmanager
    # TaskManager needs a copy of the connector JAR to run parallel pipelines too
    entrypoint: >
      bash -c "
      wget -P /opt/flink/lib/ https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.1.0-1.18/flink-sql-connector-kafka-3.1.0-1.18.jar &&
      /docker-entrypoint.sh taskmanager
      " 
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8  # Each slot splits the TaskManager's memory, so 100 slots left each one ~5MB of managed memory.
        cluster.registration.timeout: 5 min

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "127.0.0.1:9092"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "19092:19092"
    command:
      - redpanda
      - start
      - --mode
      - dev-container  # This autotunes memory and CPU usage a bit.
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://127.0.0.1:19092  # This is intentionally set to 127.0.0.1 instead of localhost to force it to use ipv4.  MacOS smartly switches between ipv4 and ipv6, but we're not sure if the python kafka client is smart enough to switch in sync, so we enforce ipv4 to be safe.

  # Creates the Kafka topic before Flink starts. Safe to rerun with an existing topic.
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! rpk topic describe youtube-clicks --brokers kafka:9092 >/dev/null 2>&1; then
          rpk topic create youtube-clicks --partitions 4 --replicas 1 --brokers kafka:9092
        fi
        rpk topic describe youtube-clicks --brokers kafka:9092

  # This is a kafka viewer.
  console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy


