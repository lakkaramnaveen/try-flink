services:
  jobmanager:
    build: ./flink
    image: try-flink/flink:1.18.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./sql:/opt/flink/sql:ro
      - flink-data:/flink-data
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        cluster.registration.timeout: 5 min
        state.checkpoints.dir: file:///flink-data/checkpoints
        state.savepoints.dir: file:///flink-data/savepoints
        # Refresh the metrics behind the REST API every second (default 10s) so the control panel's chart is live.
        metrics.fetcher.update-interval: 1000
        # Match the youtube-clicks partition count.  Benchmarked ~2.5x the throughput of parallelism 1 (see bench/).
        parallelism.default: 4

  taskmanager:
    build: ./flink  # Same image as the jobmanager; the second build is a cache hit.
    image: try-flink/flink:1.18.1
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - flink-data:/flink-data
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        # Each slot gets an equal share of the TaskManager's memory, so 100 slots left each one ~5MB of managed memory.
        # 8 slots runs the parallelism-4 job with headroom for a benchmark alongside it.
        taskmanager.numberOfTaskSlots: 8
        cluster.registration.timeout: 5 min
        state.checkpoints.dir: file:///flink-data/checkpoints
        state.savepoints.dir: file:///flink-data/savepoints

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "127.0.0.1:9092"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "19092:19092"
    command:
      - redpanda
      - start
      - --mode
      - dev-container  # This autotunes memory and CPU usage a bit.
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://127.0.0.1:19092  # This is intentionally set to 127.0.0.1 instead of localhost to force it to use ipv4.  MacOS smartly switches between ipv4 and ipv6, but we're not sure if the python kafka client is smart enough to switch in sync, so we enforce ipv4 to be safe.

  # Creates the Kafka topics before Flink starts. Safe to rerun with existing topics.
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! rpk topic describe youtube-clicks --brokers kafka:9092 >/dev/null 2>&1; then
          rpk topic create youtube-clicks --partitions 4 --replicas 1 --brokers kafka:9092
        fi
        # The Flink job's output: one record per video per minute.
        if ! rpk topic describe clicks-per-minute --brokers kafka:9092 >/dev/null 2>&1; then
          rpk topic create clicks-per-minute --partitions 1 --replicas 1 --brokers kafka:9092
        fi
        rpk topic list --brokers kafka:9092

  # This is a kafka viewer.
  console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  # Flink checkpoints and savepoints.  `docker compose down -v` deletes them.
  flink-data:
