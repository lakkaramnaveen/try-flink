name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r requirements.txt
      - run: make test PYTHON=python
      - name: Check the Docker Compose file
        run: docker compose config --quiet

  # Runs the real Kafka + Flink stack in Docker: every click is counted exactly once across a rescale and a crash.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make e2e PYTHON=python
      - name: Flink logs
        if: failure()
        run: |
          cat .flink-sql.log || true
          docker compose logs jobmanager taskmanager | tail -200
