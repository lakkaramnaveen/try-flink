<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flink playground</title>
  <link rel="stylesheet" href="/static/control-panel.css">
</head>
<body>
  <main>
    <div class="controls" aria-label="Simulation controls">
      <button id="play" class="control play" aria-label="Start everything"><span id="play-icon" class="icon play-icon"></span></button>
      <button id="stop" class="control stop" aria-label="Stop everything"><span class="icon stop-icon"></span></button>
      <button id="restart" class="control restart" aria-label="Restart everything">
        <svg class="restart-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M48.5 224H40c-13.3 0-24-10.7-24-24V72c0-9.7 5.8-18.5 14.8-22.2s19.3-1.7 26.2 5.2L98.6 96.6c87.6-86.5 228.7-86.2 315.8 1 87.5 87.5 87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3c-62.2-62.2-162.7-62.5-225.3-1L185 183c6.9 6.9 8.9 17.2 5.2 26.2s-12.5 14.8-22.2 14.8H48.5z" fill="currentColor"/></svg>
      </button>
    </div>

    <!-- Keep the options of every <select> in sync with SPEEDS, PARALLELISMS and LATE_PERCENTS in app.py. -->
    <div class="speed-wrap">
      <select id="speed" aria-label="Simulated time speed">
        <option value="1">1×</option>
        <option value="60">60×</option>
        <option value="120" selected>120×</option>
        <option value="1000">1000×</option>
        <option value="5000">5000×</option>
        <option value="10000">10000×</option>
      </select>
      <span class="chevron"></span>
    </div>

    <div class="tuning">
      <label>Flink parallelism
        <select id="parallelism">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
        </select>
      </label>
      <label>Late clicks
        <select id="late">
          <option value="0" selected>None</option>
          <option value="5">5%</option>
          <option value="20">20%</option>
        </select>
      </label>
      <button id="burst" class="burst" title="Send every click 10 times for 30 seconds">Spike ×10</button>
    </div>

    <div class="status"><span id="dot" class="dot"></span><span id="message">Checking status…</span></div>
    <div id="flink" class="flink" aria-live="polite"></div>

    <section class="traffic" aria-label="Kafka traffic">
      <div class="traffic-heading"><strong id="current-rps">0 RPS</strong><span>Kafka delivery rate · last 15 minutes</span></div>
      <canvas id="traffic-chart" class="chart" height="260"></canvas>
      <div class="legend"><span class="expected">Expected RPS</span><span class="attempted">Attempted RPS</span><span class="acked">Acknowledged RPS</span><span class="flink-line">Flink consumed RPS</span></div>
    </section>

    <section class="top-videos" aria-label="Top videos">
      <div class="traffic-heading"><strong>Top videos</strong><span id="top-window">Flink's per-minute counts appear here as each minute closes</span></div>
      <ol id="top-list"></ol>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/static/control-panel.mjs"></script>
</body>
</html>
